services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskplatform-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - taskplatform-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
    container_name: taskplatform-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TaskPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Logging__LogLevel__Microsoft.AspNetCore: Information
      # Demo-only toggle: when "true", MarketingTaskTypeSeeder runs after
      # DatabaseSeeder on a fresh DB and adds a third task type to prove
      # data-driven extensibility end-to-end. Set to "false" (or remove)
      # to revert to original seed data on the next run.ps1 spinup.
      SeedExtraTypes: "false"
    ports:
      - "5028:8080"
    networks:
      - taskplatform-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskplatform-client
    depends_on:
      - api
    ports:
      - "4200:80"
    networks:
      - taskplatform-net

networks:
  taskplatform-net:
    driver: bridge

volumes:
  mssql-data: